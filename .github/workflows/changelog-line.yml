# Every PR into develop carries one `Changelog:` line in its body, written for a person using Steampipe.
# The check is the shared one in turbot/shipyard-workflows, called at v0. A PR whose files all match
# `notShipped` in .github/release.json ships nothing and needs no line.
name: Changelog line

on:
  pull_request_target:
    branches: [develop]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  changelog-line:
    permissions:
      contents: read        # the base branch's .github/release.json
      pull-requests: write  # writes the line on a Dependabot PR
      id-token: write       # the check learns its own commit (job_workflow_sha)
    uses: turbot/shipyard-workflows/.github/workflows/changelog-line.yml@v0
