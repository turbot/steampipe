# Asks the area's approvers in Slack once the release PR's record is in. It runs on the default branch, in the
# repo's `slack` environment, when the record workflow, `Release PR`, finishes (workflow_run). The fleet App opens the release PR,
# so the PR's own events start the record, and the record's end starts this. Nothing follows the ask.
name: Ask

on:
  workflow_run:
    workflows: ["Release PR"]
    types: [completed]

permissions: {}

jobs:
  ask:
    # A record run that did not succeed asks nothing; a later record run asks.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: turbot/shipyard-workflows/.github/workflows/ask.yml@v0
    with:
      # The release PR the run is for: the one a record run started by a pull request names. A record run started by hand names
      # none, or a wrong one, so its head branch finds the PR: a release branch asks about its open PR, and any other branch looks at
      # every open release PR.
      pr: ${{ github.event.workflow_run.event != 'workflow_dispatch' && github.event.workflow_run.pull_requests[0].number || '' }}
      head-branch: ${{ github.event.workflow_run.head_branch }}
    secrets:
      SHIPYARD_SLACK_BOT_TOKEN: ${{ secrets.SHIPYARD_SLACK_BOT_TOKEN }}
