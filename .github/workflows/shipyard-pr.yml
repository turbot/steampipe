# .github/workflows/shipyard-pr.yml — identical in every repo. Do not edit.
# https://github.com/turbot/shipyard
name: Shipyard PR
run-name: Shipyard PR ${{ github.event_name }}
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions: {}
jobs:
  pr:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      actions: write
      id-token: write
    uses: turbot/shipyard-workflows/.github/workflows/pr.yml@v0
